name: CI

# This repo integrates by merging locally (no PRs), so pushes are the only
# signal CI gets — develop must be listed or feature work is never checked
# before a release reaches main. workflow_dispatch is the third way in, and it
# is what makes a fix/ branch testable *before* it is merged: without it the
# only way to learn whether a CI change works is to land it, which is how this
# workflow came to be broken for a month without anyone seeing it.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6 links against the platform's Qt runtime, and the ubuntu-24.04
      # runner image no longer preinstalls it — importing PySide6 dies with
      # "libEGL.so.1: cannot open shared object file" before a single test runs.
      # fonts-dejavu-core is not incidental: several tests measure text, and a
      # runner with no fonts at all reports different metrics than one with them.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxrandr2 libxi6 libxtst6 libnss3 libasound2t64 \
            fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      # PySide6 needs an X server on Linux CI; xvfb-run provides a headless one.
      - name: Run tests
        run: xvfb-run -a pytest
