name: CI

# This repo integrates by merging locally (no PRs), so pushes are the only
# signal CI gets — develop must be listed or feature work is never checked
# before a release reaches main.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      # PySide6 needs an X server on Linux CI; xvfb-run provides a headless one.
      - name: Run tests
        run: xvfb-run -a pytest
