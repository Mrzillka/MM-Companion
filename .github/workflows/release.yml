name: Release

# Build the shareable Windows installer and Linux tarball and publish both as
# GitHub Release assets. Builds are ~80 MB each, so they are NOT committed to git
# (see .gitignore: installer/output/) — they live only on the Releases page.
#
# Trigger by pushing a version tag that matches the package version, e.g.:
#     git tag v0.2.3 && git push origin v0.2.3
# or run manually from the Actions tab (workflow_dispatch) to smoke-test a
# build without publishing — both builds are then kept as run artifacts.
#
# The two builds run in parallel and the release is only created once both have
# succeeded, so a release never goes out with one platform missing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload the assets

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # mm_companion/__init__.py imports nothing, so this needs no install.
      - name: Read package version
        id: ver
        run: |
          v=$(PYTHONPATH=src python3 -c "import mm_companion, sys; sys.stdout.write(mm_companion.__version__)")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Package version: $v"

      # For a tag push, fail loudly if the tag and the single-sourced package
      # version disagree — a mistagged release is worse than a failed build.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="${{ steps.ver.outputs.version }}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package version $pkg. Bump mm_companion.__version__ or fix the tag."
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # 6.x: the in-app update tells a one-file build from a one-folder one by
          # where PyInstaller unpacks it (core/updates.py), which is 6.x's layout.
          pip install "pyinstaller>=6,<7"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: pwsh installer\build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: MM-Companion-Setup-${{ needs.version.outputs.version }}
          path: installer/output/MM-Companion-Setup-${{ needs.version.outputs.version }}.exe
          if-no-files-found: error

  linux:
    needs: version
    # The oldest supported Ubuntu on purpose: the frozen app links against the
    # build machine's glibc and runs only on distributions at least that new.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # PyInstaller bundles the shared libraries Qt's plugins load, but only the
      # ones it can find — libxcb-cursor0 above all, without which the xcb plugin
      # will not load on a user's machine that lacks it either.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxrandr2 libxi6 libxtst6 libnss3 libasound2 \
            fonts-dejavu-core xvfb

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pyinstaller>=6,<7"

      - name: Build tarball
        run: bash installer/build-linux.sh

      # Unpack the tarball as a user would, install it, start the installed app
      # and check it is still running after a while (timeout's 124) rather than
      # dying on a missing library or data file — then remove it again.
      - name: Smoke-test install, launch and uninstall
        run: |
          work=$(mktemp -d)
          tar -C "$work" -xzf installer/output/MM-Companion-*-linux-*.tar.gz
          "$work/MM-Companion/install.sh"
          test -x "$HOME/.local/opt/mm-companion/MM-Companion"
          test -f "$HOME/.local/share/applications/mm-companion.desktop"
          status=0
          MM_COMPANION_HOME="$work/home" timeout 20 xvfb-run -a "$HOME/.local/bin/mm-companion" || status=$?
          if [ "$status" -ne 124 ]; then
            echo "::error::The installed app exited with status $status instead of running."
            exit 1
          fi
          "$HOME/.local/opt/mm-companion/install.sh" --uninstall
          test ! -e "$HOME/.local/opt/mm-companion"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: MM-Companion-${{ needs.version.outputs.version }}-linux-x86_64
          path: installer/output/*.tar.gz
          if-no-files-found: error

  # The release body is the hand-written docs/releases/<tag>.md committed with
  # the version bump (see the make-release skill). Tags from before that
  # convention have no such file, so fall back to auto-generated notes rather
  # than failing a build over it.
  publish:
    needs: [version, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download builds
        uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          exe="assets/MM-Companion-Setup-$v.exe"
          tarball=$(ls assets/MM-Companion-"$v"-linux-*.tar.gz)
          test -f "$exe" || { echo "::error::Expected installer $exe was not produced."; exit 1; }
          title="MM-Companion $v"
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            echo "Publishing with release notes from $notes"
            gh release create "$GITHUB_REF_NAME" "$exe" $tarball --title "$title" --notes-file "$notes"
          else
            echo "::warning::No $notes found - falling back to auto-generated notes."
            gh release create "$GITHUB_REF_NAME" "$exe" $tarball --title "$title" --generate-notes
          fi
